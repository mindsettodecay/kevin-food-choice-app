<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--primary-color, #667eea) 0%, var(--secondary-color, #764ba2) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;

        .tab {

            color: white;
            border: none;
            border-radius: 20px;

            cursor: pointer;
            transition: all 0.3s ease;

        .tab:hover {

        .tab.active {
            background: var(--secondary-color, #764ba2);

        .food-grid {

        .food-item {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .food-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .food-item.selected {
            background: #e8f5e9;
            border: 3px solid #4caf50;
            transform: scale(1.05);
        }

        .food-emoji {

        .food-desc {

        .combo-counter {

        .remove-btn:hover {

            transform: scale(1.1);
        }

        .combo-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 23, 68, 0.95);
            color: white;
            padding: 30px 50px;
            border-radius: 30px;
            font-size: 2em;
            font-weight: bold;
            z-index: 2000;
            animation: comboPopup 0.5s ease;
            box-shadow: 0 10px 40px rgba(255, 23, 68, 0.5);
            display: none;
        }

        @keyframes comboPopup {
            0% { 
                transform: translate(-50%, -50%) scale(0) rotate(-10deg);
                opacity: 0;
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.2) rotate(5deg);
            }
            100% { 
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }

        .selected-foods {
            background: #f5f5f5;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 100px;
        }

        .selected-foods h2 {

        .selected-list {

        .install-btn:disabled {

            top: 0;

        .modal h2 {

        }

        .modal-foods {

        .custom-form input {

        #imageUpload {

        .image-preview {
            width: 100px;

        }

        .theme-btn {
            background: #9c27b0;
        }

        .theme-btn:hover {
            background: #7b1fa2;
            transform: translateY(-3px);
        }

        .install-btn {
            background: #2196f3;
        }

        .install-btn:hover {
            background: #1976d2;
            transform: translateY(-3px);
        }

        .install-btn:disabled {
            background: #ccc;

            transform: scale(0.7);
            transform-origin: top left;

        .desktop-mode .container {

        .zoom-controls {
            position: fixed;

        }

        .zoom-btn {
            width: 40px;
            height: 40px;

        .zoom-btn:hover {

        .zoom-display {

        @keyframes slideUp {

        .install-prompt button {

        .install-prompt button:hover {

        .install-prompt .close-btn {

<body>
    <div class="container">
        <h1>🍴 Kevin's Food Choice Helper 🍴</h1>
        <p class="subtitle">Tap the foods you want to eat today!</p>
        
        <div class="tabs">
            <button class="tab active" onclick="showCategory('breakfast')">🌅 Breakfast</button>
            <button class="tab" onclick="showCategory('lunch')">☀️ Lunch/Dinner</button>
            <button class="tab" onclick="showCategory('snacks')">🍿 Snacks</button>
            <button class="tab" onclick="showCategory('drinks')">🥤 Drinks</button>
            <button class="tab" onclick="showCategory('fastfood')">🍟 Fast Food</button>
            <button class="tab" onclick="showCategory('restaurants')">🏪 Restaurants</button>
        </div>
        
        <div class="food-grid" id="foodGrid">
            <!-- Food items will be dynamically loaded here -->
        </div>
        
        <div class="selected-foods">
            <h2>✨ My Choices Today ✨</h2>
            <div class="selected-list" id="selectedList">
                <p style="color: #999;">Tap foods above to add them here!</p>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="action-btn done-btn" onclick="showDoneModal()">✅ I'm Done!</button>
            <button class="action-btn clear-btn" onclick="clearSelections()">🗑️ Clear All</button>
            <button class="action-btn custom-btn" onclick="toggleCustomForm()">➕ Add Custom Food</button>
            <button class="action-btn voice-btn" id="voiceToggle" onclick="toggleVoice()">🔊 Voice On</button>
            <button class="action-btn install-btn" id="installBtn" onclick="installApp()" style="display: none;">📱 Install App</button>
            <button class="action-btn view-mode-btn" id="viewModeBtn" onclick="toggleViewMode()">🖥️ Desktop Mode</button>
            <button class="action-btn theme-btn" onclick="toggleThemePanel()">🎨 Themes</button>
        </div>
        
        <div class="custom-form" id="customForm">
            <input type="text" id="customFoodName" placeholder="Food name (e.g., Mac and Cheese)">
            <input type="text" id="customFoodEmoji" placeholder="Emoji (e.g., 🧀) - optional">
            <div style="margin: 15px 0;">
                <label for="imageUpload" class="image-upload-label">📷 Add Photo</label>
                <input type="file" id="imageUpload" accept="image/*" onchange="previewImage(event)">
                <img id="imagePreview" class="image-preview" alt="Food preview">
            </div>
            <button onclick="addCustomFood()">Add Food</button>
            <button onclick="toggleCustomForm()">Cancel</button>
        </div>
    </div>
    
    <div class="modal" id="doneModal">
        <div class="modal-content">
            <h2>🎉 Great Choices! 🎉</h2>
            <p>Here's what you picked:</p>
            <div class="modal-foods" id="modalFoods"></div>
            <button class="close-modal" onclick="closeDoneModal()">👍 Okay!</button>
        </div>
    </div>
    
    <div class="combo-message" id="comboMessage"></div>
    
    <div class="install-prompt" id="installPrompt">
        <span>📱 Install this app for a better experience!</span>
        <button onclick="installApp()">Install</button>
        <button class="close-btn" onclick="dismissInstallPrompt()">×</button>
    </div>

    <div class="zoom-controls" id="zoomControls" style="display: none;">
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <div class="zoom-display" id="zoomDisplay">100%</div>
        <button class="zoom-btn" onclick="zoomOut()">−</button>
        <button class="zoom-btn" onclick="resetZoom()" title="Reset">⌂</button>
    </div>

    <div class="theme-panel" id="themePanel">
        <h3>🎨 Choose Your Theme</h3>
        
        <div class="theme-presets">

        let currentCategory = 'breakfast';
        let selectedFoods = [];
        let voiceEnabled = true;
        let comboCounters = {};
        let comboTimers = {};
        let deferredPrompt;
        let isDesktopMode = false;
        let currentZoom = 1;
        let currentTheme = 'default';
        
        // Initialize speech synthesis
        const synth = window.speechSynthesis;
        
        // Load custom foods from localStorage if available
        function loadCustomFoods() {
            const customFoods = localStorage.getItem('kevinCustomFoods');
            if (customFoods) {
                const parsed = JSON.parse(customFoods);
                Object.keys(parsed).forEach(category => {
                    if (foodData[category]) {
                        foodData[category] = [...foodData[category], ...parsed[category]];
                    }
                });
            }
        }
        
        // Save custom foods to localStorage
        function saveCustomFoods() {
            const customFoods = {};
            Object.keys(foodData).forEach(category => {
                customFoods[category] = foodData[category].filter(food => food.custom);
            });
            localStorage.setItem('kevinCustomFoods', JSON.stringify(customFoods));
        }
        
        function showCategory(category) {
            currentCategory = category;
            
            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Load foods for this category
            loadFoods();
        }
        
        function loadFoods() {
            const grid = document.getElementById('foodGrid');
            grid.innerHTML = '';
            
            foodData[currentCategory].forEach((food, index) => {
                const foodItem = document.createElement('div');
                foodItem.className = 'food-item';
                if (food.custom) {
                    foodItem.classList.add('custom');
                }
                foodItem.onclick = (e) => {
                    if (!e.target.classList.contains('remove-btn')) {
                        handleFoodClick(food, foodItem);
                    }
                };
                
                // Check if this food is already selected
                if (selectedFoods.find(f => f.name === food.name)) {
                    foodItem.classList.add('selected');
                }
                
                // Show combo counter if exists
                const comboCount = comboCounters[food.name];
                const counterDisplay = comboCount && comboCount > 1 ? 
                    `<div class="combo-counter">${comboCount}</div>` : '';
                
                // Add remove button for custom foods
                const removeButton = food.custom ? 
                    `<button class="remove-btn" onclick="removeCustomFood('${food.name}', '${currentCategory}')">×</button>` : '';
                
                foodItem.innerHTML = `
                    ${counterDisplay}
                    ${removeButton}
                    ${food.image ? 
                        `<img src="${food.image}" alt="${food.name}" class="food-image">` : 
                        `<div class="food-emoji">${food.emoji}</div>`
                    }
                    <div class="food-name">${food.name}</div>
                    <div class="food-desc">${food.desc}</div>
                `;
                
                grid.appendChild(foodItem);
            });
        }
        
        function removeCustomFood(foodName, category) {
            if (confirm(`Remove ${foodName} from your custom foods?`)) {
                // Remove from food data
                const index = foodData[category].findIndex(f => f.name === foodName && f.custom);
                if (index > -1) {
                    foodData[category].splice(index, 1);
                }
                
                // Remove from selected foods if present
                const selectedIndex = selectedFoods.findIndex(f => f.name === foodName);
                if (selectedIndex > -1) {
                    selectedFoods.splice(selectedIndex, 1);
                    updateSelectedList();
                }
                
                // Save changes
                saveCustomFoods();
                
                // Reload display
                loadFoods();
                
                if (voiceEnabled) {
                    speak(`Removed ${foodName}`);
                }
            }
        }
        
        function handleFoodClick(food, element) {
            // Speak the food name
            if (voiceEnabled) {
                speak(food.name);
            }
            
            // Handle combo counter
            if (!comboCounters[food.name]) {
                comboCounters[food.name] = 0;
            }
            comboCounters[food.name]++;
            
            // Clear existing timer
            if (comboTimers[food.name]) {
                clearTimeout(comboTimers[food.name]);
            }
            
            // Show combo message for milestones
            if (comboCounters[food.name] % 10 === 0) {
                showComboMessage(`Kevin likes ${food.name} ${comboCounters[food.name]} times! 🔥`);
            }
            
            // Set timer to reset combo
            comboTimers[food.name] = setTimeout(() => {
                comboCounters[food.name] = 0;
                loadFoods(); // Refresh display
            }, 10000);
            
            // Toggle selection
            toggleFood(food);
        }
        
        function toggleFood(food) {
            const index = selectedFoods.findIndex(f => f.name === food.name);
            
            if (index > -1) {
                // Remove from selection
                selectedFoods.splice(index, 1);
            } else {
                // Add to selection
                selectedFoods.push(food);
            }
            
            updateSelectedList();
            loadFoods(); // Refresh to show selected state and combo counter
        }
        
        function speak(text) {
            if (!synth) return;
            
            // Cancel any ongoing speech
            synth.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            
            synth.speak(utterance);
        }
        
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('voiceToggle');
            btn.textContent = voiceEnabled ? '🔊 Voice On' : '🔇 Voice Off';
            btn.classList.toggle('active', voiceEnabled);
            
            if (voiceEnabled) {
                speak('Voice is on');
            }
        }
        
        function showComboMessage(message) {
            const comboDiv = document.getElementById('comboMessage');
            comboDiv.textContent = message;
            comboDiv.style.display = 'block';
            
            // Speak the combo message
            if (voiceEnabled) {
                speak(message);
            }
            
            setTimeout(() => {
                comboDiv.style.display = 'none';
            }, 3000);
        }
        
        function updateSelectedList() {
            const list = document.getElementById('selectedList');
            
            if (selectedFoods.length === 0) {
                list.innerHTML = '<p style="color: #999;">Tap foods above to add them here!</p>';
            } else {
                list.innerHTML = selectedFoods.map(food => `
                    <div class="selected-item">
                        ${food.image ? 
                            `<img src="${food.image}" alt="${food.name}" style="width: 30px; height: 30px; border-radius: 50%; object-fit: cover;">` : 
                            `<span class="emoji">${food.emoji}</span>`
                        }
                        <span>${food.name}</span>
                    </div>
                `).join('');
            }
        }
        
        function clearSelections() {
            selectedFoods = [];
            updateSelectedList();
            loadFoods();
            
            if (voiceEnabled) {
                speak('All cleared');
            }
        }
        
        function showDoneModal() {
            if (selectedFoods.length === 0) {
                if (voiceEnabled) {
                    speak('Please select at least one food first');
                }
                alert('Please select at least one food first! 😊');
                return;
            }
            
            const modal = document.getElementById('doneModal');
            const modalFoods = document.getElementById('modalFoods');
            
            modalFoods.innerHTML = selectedFoods.map(food => 
                food.image ? 
                    `<img src="${food.image}" alt="${food.name}" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover;">` : 
                    food.emoji
            ).join(' ');
            
            modal.style.display = 'flex';
            
            if (voiceEnabled) {
                const foodNames = selectedFoods.map(f => f.name).join(', ');
                speak(`Great choices! You picked ${foodNames}`);
            }
        }
        
        function closeDoneModal() {
            document.getElementById('doneModal').style.display = 'none';
        }
        
        function toggleCustomForm() {
            const form = document.getElementById('customForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
            
            // Reset form
            document.getElementById('customFoodName').value = '';
            document.getElementById('customFoodEmoji').value = '';
            document.getElementById('imageUpload').value = '';
            document.getElementById('imagePreview').style.display = 'none';
        }
        
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
        
        function addCustomFood() {
            const name = document.getElementById('customFoodName').value.trim();
            const emoji = document.getElementById('customFoodEmoji').value.trim() || '🍽️';
            const imagePreview = document.getElementById('imagePreview');
            const image = imagePreview.style.display === 'block' ? imagePreview.src : null;
            
            if (!name) {
                if (voiceEnabled) {
                    speak('Please enter a food name');
                }
                alert('Please enter a food name! 😊');
                return;
            }
            
            const newFood = {
                emoji: emoji,
                name: name,
                desc: 'Custom food',
                image: image,
                custom: true
            };
            
            foodData[currentCategory].push(newFood);
            saveCustomFoods();
            
            if (voiceEnabled) {
                speak(`Added ${name} to ${currentCategory}`);
            }
            
            // Clear form
            toggleCustomForm();
            
            // Reload foods
            loadFoods();
        }
        
        // PWA Installation Functions
        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                        hideInstallButton();
                        dismissInstallPrompt();
                        if (voiceEnabled) {
                            speak('App installed successfully!');
                        }
                    } else {
                        console.log('User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                });
            } else {
                // Fallback for browsers that don't support installation
                if (voiceEnabled) {
                    speak('To install this app, use your browser\'s menu and select Add to Home Screen');
                }
                alert('To install this app:\n\n1. Open your browser menu (⋮)\n2. Select "Add to Home screen"\n3. Follow the prompts');
            }
        }

        function showInstallButton() {
            const installBtn = document.getElementById('installBtn');
            if (installBtn) {
                installBtn.style.display = 'inline-block';
            }
        }

        function hideInstallButton() {
            const installBtn = document.getElementById('installBtn');
            if (installBtn) {
                installBtn.style.display = 'none';
            }
        }

        function showInstallPrompt() {
            const prompt = document.getElementById('installPrompt');
            if (prompt && !localStorage.getItem('installPromptDismissed')) {
                setTimeout(() => {
                    prompt.style.display = 'flex';
                }, 5000); // Show after 5 seconds
            }
        }

        function dismissInstallPrompt() {
            const prompt = document.getElementById('installPrompt');
            if (prompt) {
                prompt.style.display = 'none';
                localStorage.setItem('installPromptDismissed', 'true');
            }
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Listen for the beforeinstallprompt event
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Save the event so it can be triggered later
            deferredPrompt = e;
            // Show install button
            showInstallButton();
            // Show install prompt
            showInstallPrompt();
        });

        // Listen for app installed event
        window.addEventListener('appinstalled', (evt) => {
            console.log('App was installed');
            hideInstallButton();
            dismissInstallPrompt();
            if (voiceEnabled) {
                speak('Welcome to your new app!');
            }
        });

        // Theme System
        const themes = {
            default: { primary: '#667eea', secondary: '#764ba2' },
            sunset: { primary: '#ff7e5f', secondary: '#feb47b' },
            ocean: { primary: '#00c9ff', secondary: '#92fe9d' },
            forest: { primary: '#134e5e', secondary: '#71b280' },
            cherry: { primary: '#eb3349', secondary: '#f45c43' },
            dark: { primary: '#2c3e50', secondary: '#34495e' }
        };

        function toggleThemePanel() {
            const panel = document.getElementById('themePanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            
            if (voiceEnabled && panel.style.display === 'block') {
                speak('Theme panel opened');
            }
        }

        function selectPreset(themeName) {
            // Remove active class from all presets
            document.querySelectorAll('.theme-preset').forEach(preset => {
                preset.classList.remove('active');
            });
            
            // Add active class to selected preset
            event.target.classList.add('active');
            
            // Update color pickers
            const theme = themes[themeName];
            document.getElementById('primaryColor').value = theme.primary;
            document.getElementById('secondaryColor').value = theme.secondary;
            
            currentTheme = themeName;
            applyTheme(theme.primary, theme.secondary);
            
            if (voiceEnabled) {
                speak(`${themeName} theme selected`);
            }
        }

        function applyCustomTheme() {
            const primary = document.getElementById('primaryColor').value;
            const secondary = document.getElementById('secondaryColor').value;
            
            applyTheme(primary, secondary);
            currentTheme = 'custom';
            
            // Save to localStorage
            localStorage.setItem('kevinFoodTheme', JSON.stringify({
                primary: primary,
                secondary: secondary,
                name: 'custom'
            }));
            
            if (voiceEnabled) {
                speak('Custom theme applied');
            }
        }

        function applyTheme(primary, secondary) {
            document.documentElement.style.setProperty('--primary-color', primary);
            document.documentElement.style.setProperty('--secondary-color', secondary);
        }

        function resetToDefault() {
            const defaultTheme = themes.default;
            document.getElementById('primaryColor').value = defaultTheme.primary;
            document.getElementById('secondaryColor').value = defaultTheme.secondary;
            
            // Update preset selection
            document.querySelectorAll('.theme-preset').forEach(preset => {
                preset.classList.remove('active');
            });
            document.querySelector('.theme-preset[onclick*="default"]').classList.add('active');
            
            applyTheme(defaultTheme.primary, defaultTheme.secondary);
            currentTheme = 'default';
            
            // Remove from localStorage
            localStorage.removeItem('kevinFoodTheme');
            
            if (voiceEnabled) {
                speak('Theme reset to default');
            }
        }

        // Load saved theme
        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('kevinFoodTheme');
            if (savedTheme) {
                const theme = JSON.parse(savedTheme);
                applyTheme(theme.primary, theme.secondary);
                document.getElementById('primaryColor').value = theme.primary;
                document.getElementById('secondaryColor').value = theme.secondary;
                currentTheme = theme.name;
            }
        }

        // View Mode and Zoom Functions
        function toggleViewMode() {
            const body = document.body;
            const btn = document.getElementById('viewModeBtn');
            const zoomControls = document.getElementById('zoomControls');
            
            isDesktopMode = !isDesktopMode;
            
            if (isDesktopMode) {
                // Enable desktop mode
                body.classList.add('desktop-mode');
                btn.textContent = '📱 Mobile Mode';
                zoomControls.style.display = 'flex';
                updateViewport('width=1200, initial-scale=0.3, user-scalable=yes');
                
                if (voiceEnabled) {
                    speak('Desktop mode enabled');
                }
            } else {
                // Enable mobile mode
                body.classList.remove('desktop-mode');
                btn.textContent = '🖥️ Desktop Mode';
                zoomControls.style.display = 'none';
                resetZoom();
                updateViewport('width=device-width, initial-scale=1.0');
                
                if (voiceEnabled) {
                    speak('Mobile mode enabled');
                }
            }
            
            saveViewModePreference();
        }

        function updateViewport(content) {
            const viewport = document.getElementById('viewport-meta');
            viewport.setAttribute('content', content);
        }

        function zoomIn() {
            currentZoom = Math.min(currentZoom + 0.1, 2.0);
            applyZoom();
        }

        function zoomOut() {
            currentZoom = Math.max(currentZoom - 0.1, 0.5);
            applyZoom();
        }

        function resetZoom() {
            currentZoom = 1.0;
            applyZoom();
        }

        function applyZoom() {
            const container = document.querySelector('.container');
            if (isDesktopMode) {
                container.style.transform = `scale(${currentZoom * 1.2})`;
            } else {
                container.style.transform = `scale(${currentZoom})`;
            }
            
            const zoomDisplay = document.getElementById('zoomDisplay');
            zoomDisplay.textContent = Math.round(currentZoom * 100) + '%';
        }

                    speak('To install this app, use your browser\'s menu and select Add to Home Screen');

            }
        }

        function dismissInstallPrompt() {
            const prompt = document.getElementById('installPrompt');
            if (prompt) {
                prompt.style.display = 'none';
                localStorage.setItem('installPromptDismissed', 'true');
            }
        }

        // Auto-detect mobile and show desktop mode option
        function isMobileDevice() {
            return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                || window.innerWidth <= 768;
        }

        // Enhanced mobile detection and initial setup
        function initializeMobileFeatures() {
            if (isMobileDevice()) {
                // Show desktop mode button by default on mobile
                const viewModeBtn = document.getElementById('viewModeBtn');
                viewModeBtn.style.display = 'inline-block';
                
                // Auto-enable desktop mode if screen is very small
                if (window.innerWidth <= 480) {
                    setTimeout(() => {
                        if (!localStorage.getItem('viewModePreference')) {
                            // Ask user if they want desktop mode
                            if (confirm('Your screen is small. Would you like to enable Desktop Mode for a better view?')) {
                                toggleViewMode();
                                localStorage.setItem('viewModePreference', 'desktop');
                            } else {
                                localStorage.setItem('viewModePreference', 'mobile');
                            }
                        }
                    }, 2000);
                }
                
                // Restore user preference
                const preference = localStorage.getItem('viewModePreference');
                if (preference === 'desktop' && !isDesktopMode) {
                    toggleViewMode();
                }
            }
        }

        // Save view mode preference
        function saveViewModePreference() {
            localStorage.setItem('viewModePreference', isDesktopMode ? 'desktop' : 'mobile');
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Listen for the beforeinstallprompt event
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Save the event so it can be triggered later
            deferredPrompt = e;
            // Show install button
            showInstallButton();
            // Show install prompt
            showInstallPrompt();
        });

        // Listen for app installed event
        window.addEventListener('appinstalled', (evt) => {
            console.log('App was installed');
            hideInstallButton();
            dismissInstallPrompt();
            if (voiceEnabled) {
                speak('Welcome to your new app!');
            }
        });

        // Initialize the app
        loadCustomFoods();
        loadFoods();
        loadSavedTheme();
        initializeMobileFeatures();
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('doneModal');
            const themePanel = document.getElementById('themePanel');
            
            if (event.target === modal) {
                closeDoneModal();
            }
            
            if (event.target === themePanel) {
                themePanel.style.display = 'none';
            }
        }
        
        // Initialize voice
        if (voiceEnabled) {
            // Wait a bit for voices to load
            setTimeout(() => {
                speak('Welcome to Kevin\'s Food Choice Helper');
            }, 1000);
        }
    </script>
</body>
</html>
